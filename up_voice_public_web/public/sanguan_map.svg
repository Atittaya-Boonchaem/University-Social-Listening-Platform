<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16"/>

  <!-- Grid lines -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)" opacity="0.5"/>

  <!-- Title Header Banner -->
  <rect x="0" y="0" width="800" height="54" fill="url(#purpleGrad)"/>
  <text x="24" y="34" fill="#FFFFFF" font-family="'Sarabun', 'Inter', sans-serif" font-size="20" font-weight="bold">📍 แผนที่ผังการเดินทาง: อาคารสงวนเสริมศรี (ประตู 2 มหาวิทยาลัยพะเยา)</text>

  <!-- Main Road (ถนนพหลโยธิน / หน้ามอ) -->
  <rect x="40" y="80" width="60" height="330" fill="url(#roadGrad)" rx="8"/>
  <text x="70" y="240" fill="#475569" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" transform="rotate(-90 70 240)" text-anchor="middle">ถนนสายหลัก / หน้ามอ</text>

  <!-- Door 1 Marker -->
  <rect x="110" y="100" width="120" height="50" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="170" y="130" fill="#334155" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">🚪 ประตู 1 มพ.</text>

  <!-- Door 2 Marker (Focus) -->
  <rect x="110" y="260" width="130" height="60" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="175" y="295" fill="#B45309" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🚪 ประตู 2 (ทางเข้าหลัก)</text>

  <!-- Bus Route Line 2 (Purple Dashed Path) -->
  <path d="M 70 290 L 175 290 L 320 290 L 520 290 L 520 200" fill="none" stroke="#8B5CF6" stroke-width="6" stroke-dasharray="10 6"/>
  <rect x="180" y="325" width="180" height="32" fill="#8B5CF6" rx="16"/>
  <text x="270" y="346" fill="#FFFFFF" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🚌 เส้นทางรถเมล์ มพ. สาย 2 (PKY)</text>

  <!-- Satit UP School Building -->
  <g transform="translate(300, 100)" filter="url(#shadow)">
    <rect width="180" height="110" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" rx="12"/>
    <rect width="180" height="36" fill="#DBEAFE" rx="12"/>
    <text x="90" y="24" fill="#1E40AF" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">🏫 โรงเรียนสาธิต มพ.</text>
    <text x="90" y="65" fill="#475569" font-family="'Sarabun', sans-serif" font-size="13" text-anchor="middle">โซนการศึกษาประตู 2</text>
  </g>

  <!-- Connection Road to Sanguan -->
  <path d="M 390 210 L 390 260" fill="none" stroke="#CBD5E1" stroke-width="12"/>

  <!-- TARGET: Sanguan Sermsri Building (Highlighted Pin) -->
  <g transform="translate(480, 190)" filter="url(#shadow)">
    <rect width="260" height="170" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4" rx="16"/>
    <rect width="260" height="44" fill="url(#purpleGrad)" rx="14"/>
    <text x="130" y="28" fill="#FFFFFF" font-family="'Sarabun', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">🏢 อาคารสงวนเสริมศรี 📍</text>
    
    <!-- Details -->
    <text x="20" y="75" fill="#1E293B" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold">• จุดบริการส่งเอกสาร / ติดต่อสอบถาม</text>
    <text x="20" y="102" fill="#475569" font-family="'Sarabun', sans-serif" font-size="13">• ตำแหน่ง: ประตู 2 ใกล้โรงเรียนสาธิต มพ.</text>
    <text x="20" y="128" fill="#475569" font-family="'Sarabun', sans-serif" font-size="13">• รถเมล์: สาย 2 (PKY/รร.สาธิต)</text>
    
    <!-- Pin Icon badge -->
    <circle cx="230" cy="22" r="16" fill="#EF4444"/>
    <text x="230" y="27" fill="#FFFFFF" font-family="'Sarabun', sans-serif" font-size="14" text-anchor="middle">📍</text>
  </g>

  <!-- Bus Stop Icon at Sanguan -->
  <g transform="translate(490, 275)">
    <rect width="36" height="36" fill="#10B981" rx="8"/>
    <text x="18" y="24" fill="#FFFFFF" font-family="'Sarabun', sans-serif" font-size="18" text-anchor="middle">🚏</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(740, 90)">
    <circle cx="20" cy="20" r="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="20" y="16" fill="#EF4444" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">N</text>
    <text x="20" y="32" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle">S</text>
  </g>
</svg>
